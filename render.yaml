services:
  - type: web
    name: freebatch-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --no-browser --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FREE_ONLY_MODE
        value: "true"
      - key: AGNES_API_KEY
        sync: false
      - key: AI_HORDE_API_KEY
        sync: false
