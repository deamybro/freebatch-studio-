{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1>Settings</h1>
  <button id="btnSave" class="btn btn-primary">Save</button>
</div>
<div id="settingsForm" class="settings-form"></div>
<div class="card">
  <h2>Secret keys (never stored, env only)</h2>
  <div id="secretStatus" class="kv"></div>
  <p class="muted">Set <code>AGNES_API_KEY</code> and <code>AI_HORDE_API_KEY</code> in
  your <code>.env</code> file or environment. They are masked everywhere and never
  written to the database.</p>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/settings.js"></script>
{% endblock %}
